{% extends "base.html" %}
{% from "_macros.html" import icon %}
{% block title %}Changer mot de passe — FANTA{% endblock %}

{% block content %}
<div class="page-head slide-up">
  <a class="back-btn" href="{{ url_for('account.profile') }}">{{ icon('chevron-left') }}</a>
  <h1>Changer mot de passe</h1>
</div>

<div class="card card-pad slide-up">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label class="form-label" for="current_password">Mot de passe actuel</label>
      <input class="form-control" id="current_password" name="current_password" type="password" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="new_password">Nouveau mot de passe</label>
      <input class="form-control" id="new_password" name="new_password" type="password" required minlength="6">
    </div>
    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirmation</label>
      <input class="form-control" id="confirm_password" name="confirm_password" type="password" required minlength="6">
    </div>
    <button class="btn btn-primary btn-block" type="submit">Valider</button>
  </form>
</div>
{% endblock %}
