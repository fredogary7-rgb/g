{% extends "base.html" %}
{% from "_macros.html" import icon %}
{% block title %}Modifier profil — FANTA{% endblock %}

{% block content %}
<div class="page-head slide-up">
  <a class="back-btn" href="{{ url_for('account.profile') }}">{{ icon('chevron-left') }}</a>
  <h1>Modifier profil</h1>
</div>

<div class="card card-pad slide-up">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label class="form-label" for="username">Nom d'utilisateur</label>
      <input class="form-control" id="username" name="username" type="text" value="{{ user.username }}" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="country">Pays</label>
      <select class="form-control" id="country" name="country" required>
        {% for c in countries %}
        <option value="{{ c }}" {{ 'selected' if c == user.country }}>{{ c }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label" for="phone">Téléphone</label>
      <input class="form-control" id="phone" name="phone" type="tel" placeholder="+226 70 12 34 56" value="{{ user.phone or '' }}">
    </div>
    <button class="btn btn-primary btn-block" type="submit">Enregistrer</button>
  </form>
</div>
{% endblock %}
